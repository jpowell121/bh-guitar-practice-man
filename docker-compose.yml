version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: guitar_practice_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: guitar_practice
      MYSQL_USER: guitar_user
      MYSQL_PASSWORD: guitar_password
    ports:
      - "3307:3306"
    volumes:
      - guitar_practice_data:/var/lib/mysql

volumes:
  guitar_practice_data: